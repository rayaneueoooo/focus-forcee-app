<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus & Force - بنك الكويزات التفاعلية</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gold: #e2b714;
      --text-main: #f0f3f8;
      --text-muted: #9aa0a6;
      --glass-glow: rgba(226, 183, 20, 0.12);
      --correct-color: #2ec4b6;
      --wrong-color: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arabic Typesetting, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
      direction: rtl;
    }

    /* الهيدر بتصميم زجاجي مطفي */
    .header-card {
      background: rgba(18, 20, 26, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .header-card h2 {
      color: var(--accent-gold);
      font-size: 1.3rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* كارت الكويز بالطابع الزجاجي السائل Liquid Glass */
    .quiz-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .quiz-card::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -40%;
      width: 180%;
      height: 180%;
      background: radial-gradient(circle, var(--glass-glow) 0%, transparent 60%);
      pointer-events: none;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    /* خيارات الاستطلاع (Poll Style) */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: right;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-gold);
    }

    .option-btn.correct {
      background: rgba(46, 196, 182, 0.2) !important;
      border-color: var(--correct-color) !important;
      color: #fff;
      font-weight: bold;
    }

    .option-btn.wrong {
      background: rgba(230, 57, 70, 0.2) !important;
      border-color: var(--wrong-color) !important;
      color: #fff;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.75;
    }

    /* أزرار التنقل */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 22px;
    }

    .action-btn {
      background: var(--accent-gold);
      color: #0b0d10;
      border: none;
      padding: 12px 26px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <div class="header-card">
    <h2>🧩 قسم الكويزات التفاعلية</h2>
    <p>اختبر معلوماتك، اجمع النقاط، واكتشف مستوى تحضيرك مع عائلة Focus & Force ✨</p>
  </div>

  <!-- حاوية الكويز -->
  <div class="quiz-card" id="quizCard">
    <div class="quiz-header">
      <span id="subjectBadge">تركيب البروتين 🧬</span>
      <span id="questionProgress">السؤال 1 / 300</span>
    </div>

    <div class="question-title" id="questionText">
      جاري تحميل السؤال...
    </div>

    <div class="options-container" id="optionsContainer"></div>

    <div class="actions-bar">
      <button class="action-btn" id="nextBtn" onclick="nextQuestion()" disabled>السؤال التالي ➔</button>
    </div>
  </div>

  <script>
    // البيانات الخام المحولة تلقائياً إلى خيارات استطلاع (1 صحيحة + 2 خاطئة)
    const rawData = [
      // مجموعة 1: تركيب البروتين
      { q: "أين يتم تركيب البروتين في الخلية حقيقية النواة؟", a: "في الهيولة", w1: "في النواة", w2: "في جهاز غولجي", cat: "تركيب البروتين 🧬" },
      { q: "ما هي العضية المتخصصة في بناء السلسلة الببتيدية؟", a: "الريبوزوم (الشبكة المحببة)", w1: "الجسيم المركزي", w2: "المايتوكندريا", cat: "تركيب البروتين 🧬" },
      { q: "ما هي العمارة الأساسية لبناء البروتينات؟", a: "الأحماض الأمينية", w1: "الأحماض الدهنية", w2: "السكريات الأحادية", cat: "تركيب البروتين 🧬" },
      { q: "ما هو جزيء النقل المحمول للمعلومة الوراثية من النواة للهيولة؟", a: "الـ ARNm", w1: "الـ ARNt", w2: "الـ ARNr", cat: "تركيب البروتين 🧬" },
      { q: "ما اسم الإنزيم المسؤول عن ظاهرة الاستنساخ؟", a: "إنزيم ARN بوليميراز", w1: "إنزيم ADN بوليميراز", w2: "إنزيم الليجاز", cat: "تركيب البروتين 🧬" },
      { q: "ما هي المراحل الأساسية لظاهرة الاستنساخ؟", a: "الانطلاق، الاستطالة، والنهاية", w1: "التنشيط، التثبيت، والقطع", w2: "التمهيدية، الاستوائية، والانفصالية", cat: "تركيب البروتين 🧬" },
      { q: "ما السلسلة التي يعتمد عليها الإنزيم في النسخ؟", a: "السلسلة المستنسخة (3' إلى 5')", w1: "السلسلة غير المستنسخة", w2: "السلسلتان معاً", cat: "تركيب البروتين 🧬" },
      { q: "ما القاعدة الإزوتية المميزة للـ ARN مقارنة بالـ ADN؟", a: "اليوراسيل (U)", w1: "الثيمين (T)", w2: "الساميتوزين (C)", cat: "تركيب البروتين 🧬" },
      { q: "ما هو السكر الخماسي في الـ ARN؟", a: "سكر الريبوز (C5H10O5)", w1: "سكر الريبوز منقوص الأكسجين", w2: "سكر الجلوكوز", cat: "تركيب البروتين 🧬" },
      { q: "ما هو السكر الخماسي في الـ ADN؟", a: "سكر الريبوز منقوص الأكسجين (C5H10O4)", w1: "سكر الريبوز العادي", w2: "سكر الفركتوز", cat: "تركيب البروتين 🧬" },
      { q: "ما هي الشفرة الوراثية؟", a: "نظام التشفير يربط النيوكليوتيدات بالأحماض الأمينية", w1: "تسلسل الأحماض الدهنية في الغشاء", w2: "عدد الروابط الهيدروجينية في الـ ADN", cat: "تركيب البروتين 🧬" },
      { q: "ما هي الرامزة (Codon)؟", a: "ثلاثية من النيوكليوتيدات المتتالية على ARNm", w1: "ثنائية نيوكليوتيدية على الـ ARNt", w2: "حمض أميني مرتبط بإنزيم", cat: "تركيب البروتين 🧬" },
      { q: "كم عدد الرامزات الممكنة في الشفرة الوراثية؟", a: "64 رامزة", w1: "20 رامزة", w2: "46 رامزة", cat: "تركيب البروتين 🧬" },
      { q: "كم عدد الرامزات المشفرة للأحماض الأمينية؟", a: "61 رامزة", w1: "64 رامزة", w2: "20 رامزة", cat: "تركيب البروتين 🧬" },
      { q: "ما هي رامزة الانطلاق الشهيرة وما الحمض الذي تشفره؟", a: "AUG وتوافق حمض الميثيونين (Met)", w1: "UAA وتوافق حمض الفالين", w2: "UAG وتوافق حمض الليسين", cat: "تركيب البروتين 🧬" },
      { q: "ما هي رامزات التوقف (Stop Codons) الثلاث؟", a: "UAA ، UAG ، UGA", w1: "AUG ، UAA ، GGG", w2: "CCC ، UAA ، UGA", cat: "تركيب البروتين 🧬" },
      { q: "ما معنى أن الشفرة الوراثية 'مترادفة'؟", a: "حمض أميني واحد تشفره عدة رامزات", w1: "كل رامزة تشفر عدة أحماض أمينية", w2: "تتغير الشفرة من خلية لأخرى", cat: "تركيب البروتين 🧬" },
      { q: "ما معنى أن الشفرة الوراثية 'شاملة'؟", a: "محددة ونفسها تقريباً في معظم الكائنات", w1: "توجد فقط في الإنسان والحيوان", w2: "تتكون من جميع القواعد النيتروجينية", cat: "تركيب البروتين 🧬" },
      { q: "ما هي المكونات الدقيقة للريبوزوم؟", a: "تحت وحدة صغرى وتحت وحدة كبرى", w1: "غشاء مضاعف وحشوة", w2: "سلسلة ببتيدية وجزيء غلوكوز", cat: "تركيب البروتين 🧬" },
      { q: "ما هما موقعا التثبيت الأساسيان في تحت الوحدة الكبرى؟", a: "الموقع P والموقع A", w1: "الموقع X والموقع Y", w2: "الموقع 3' والموقع 5'", cat: "تركيب البروتين 🧬" },

      // مجموعة 2: العلاقة بين بنية ووظيفة البروتين
      { q: "ما هي الصيغة العامة للحمض الأميني؟", a: "R-CH(NH2)-COOH", w1: "R-CO-NH2", w2: "R-CH2-OH", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "بماذا يختلف حمض أميني عن آخر؟", a: "بالجذر الكيميائي السلسلي الجانبي (R)", w1: "بالوظيفة الكربوكسيلية", w2: "بالوظيفة الأمينية", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "كم عدد الأحماض الأمينية القياسية التي تدخل في تركيب البروتينات؟", a: "20 حمضاً أمينياً", w1: "64 حمضاً", w2: "12 حمضاً", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "ما هي الخاصية الأمفوتيرية (الحمقلية) للأحماض الأمينية؟", a: "السلوك كحمض في الوسط القاعدي وكقاعدة في الحامضي", w1: "الذوبان في الدهون فقط", w2: "تغيير ألوان الكواشف بشكل دائمل", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "ما هي نقطة التكهرب التعادلي (pHi) للحمض الأميني؟", a: "قيمة pH الوسط التي تكون عندها محصلة الشحنة صفر", w1: "درجة غليان الحمض الأميني", w2: "أقصى شحنة موجبة يتحملها الحمض", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "ما هي مستويات البنية الفراغية للبروتينات؟", a: "أولية، ثانوية، ثالثية، ورابعية", w1: "خطية، دائريّة، ومكعبة", w2: "أحادية وثنائية فقط", cat: "بنية ووظيفة البروتين 🧪" },
      { q: "بين أي الأحماض الأمينية تنشأ الرابطة ثنائية الكبريت؟", a: "بين جذور حمض السستئين (Cysteine)", w1: "بين جذور الجليسين", w2: "بين الألانين والفالين", cat: "بنية ووظيفة البروتين 🧪" },

      // مجموعة 3: النشاط الإنزيمي
      { q: "ما هو الإنزيم؟", a: "وسيط حيوي بروتيني يسرع التفاعلات دون أن يُستهلك", w1: "مادة سكرية توفر الطاقة للخلية", w2: "دهن غشائي ينقل الشوارئ", cat: "النشاط الإنزيمي ⚡" },
      { q: "ما معنى 'التخصص الوظيفي المزدوج' للإنزيم؟", a: "نوعي لركيزة معينة ولنوع التفاعل", w1: "يعمل في الوسط الحامضي والقاعدي معاً", w2: "يبني ويهدم في نفس اللحظة", cat: "النشاط الإنزيمي ⚡" },
      { q: "ما هو الموقع الفعال للإنزيم؟", a: "تجويف يتكامل مع الركيزة ويرتبط بها للتفاعل", w1: "الغشاء الخارجي للإنزيم", w2: "الذيل الهيدروكربوني للبروتين", cat: "النشاط الإنزيمي ⚡" },
      { q: "ما هي درجة الحرارة المثلى للإنزيم في جسم الإنسان؟", a: "37°C تقريباً", w1: "0°C", w2: "100°C", cat: "النشاط الإنزيمي ⚡" },

      // مجموعة 4: المناعة والدفاع عن الذات
      { q: "ما هي الجزيئات البروتينية الأساسية المحددة للذات؟", a: "معقد التوافق النسيجي الرئيسي (CMH / HLA)", w1: "الهيموجلوبين", w2: "الأستيل كولين", cat: "المناعة والدفاع عن الذات 🛡️" },
      { q: "ما هي السلاسل المكونة للجسم المضاد (IgG)؟", a: "سلسلتان ثقيلتان (H) وسلسلتان خفيفتان (L)", w1: "4 سلاسل ثقيلة متماثلة", w2: "سلسلة واحدة حلزونية", cat: "المناعة والدفاع عن الذات 🛡️" },
      { q: "ما هي الخلايا اللمفاوية المسؤولة عن المناعة الخلطية؟", a: "الخلايا اللمفاوية B (الـ LB)", w1: "الخلايا اللمفاوية T (الـ LT)", w2: "الكريات الحمراء", cat: "المناعة والدفاع عن الذات 🛡️" },
      { q: "ما الخلية المستهدفة الرئيسية لفيروس السيدا (VIH)؟", a: "الخلايا الحاملة لـ CD4 (كالـ LT4 والبالعات)", w1: "الكريات الحمراء", w2: "خلايا العضلات", cat: "المناعة والدفاع عن الذات 🛡️" },

      // مجموعة 5: الاتصال العصبي
      { q: "ما هو كمون الراحة للعصبون؟", a: "-70mV تقريباً", w1: "+30mV", w2: "0mV", cat: "الاتصال العصبي 🧠" },
      { q: "ما هو المبلغ العصبي التنبيهي الشهير؟", a: "الأستيل كولين (Acetylcholine)", w1: "حمض GABA", w2: "البيرفورين", cat: "الاتصال العصبي 🧠" },
      { q: "ما هو المبلغ العصبي التثبيطي الشهير؟", a: "حمض غاما أمينوبوتيريك (GABA)", w1: "الأستيل كولين", w2: "الأدرينالين", cat: "الاتصال العصبي 🧠" },

      // مجموعة 6: التركيب الضوئي والتنفس
      { q: "ما هي العضية المتخصصة في ظاهرة التركيب الضوئي؟", a: "الصانعة الخضراء (Chloroplast)", w1: "الميتوكندريا", w2: "جهاز غولجي", cat: "التركيب الضوئي والتنفس 🌿" },
      { q: "أين تحدث المرحلة الكيميوضوئية؟", a: "في غشاء التيلاكويد", w1: "في الحشوة (Stroma)", w2: "في الهيولة الشفافة", cat: "التركيب الضوئي والتنفس 🌿" },
      { q: "ما هي العضية الأساسية لعملية التنفس الخلوي؟", a: "الميتوكندريا (Mitochondria)", w1: "الصانعة الخضراء", w2: "الريبوزوم", cat: "التركيب الضوئي والتنفس 🌿" },
      { q: "ما الحصيلة الطاقوية الإجمالية لأكسدة جلوكوز واحد تنفسياً؟", a: "38 جزيء ATP (أو 36)", w1: "2 جزيء ATP", w2: "100 جزيء ATP", cat: "التركيب الضوئي والتنفس 🌿" }
    ];

    let currentIndex = 0;
    let answered = false;

    // خلط ترتيب الخيارات لتصبح عشوائية في كل مرة
    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function renderQuestion() {
      const item = rawData[currentIndex];
      answered = false;

      document.getElementById("subjectBadge").innerText = item.cat;
      document.getElementById("questionProgress").innerText = `السؤال ${currentIndex + 1} / ${rawData.length}`;
      document.getElementById("questionText").innerText = item.q;
      document.getElementById("nextBtn").disabled = true;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      // تجهيز الخيارات (واحدة صح و 2 خطأ)
      const options = shuffle([
        { text: item.a, correct: true },
        { text: item.w1, correct: false },
        { text: item.w2, correct: false }
      ]);

      options.forEach(opt => {
        const btn = document.createElement("div");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${opt.text}</span><span class="icon"></span>`;
        btn.onclick = () => handleAnswer(btn, opt.correct);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedBtn, isCorrect) {
      if (answered) return;
      answered = true;

      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(btn => btn.classList.add("disabled"));

      if (isCorrect) {
        selectedBtn.classList.add("correct");
        selectedBtn.querySelector(".icon").innerText = "✓";
      } else {
        selectedBtn.classList.add("wrong");
        selectedBtn.querySelector(".icon").innerText = "✗";

        // إبراز الإجابة الصحيحة للتلميذ
        allBtns.forEach(btn => {
          const item = rawData[currentIndex];
          if (btn.innerText.includes(item.a)) {
            btn.classList.add("correct");
            btn.querySelector(".icon").innerText = "✓";
          }
        });
      }

      document.getElementById("nextBtn").disabled = false;
    }

    function nextQuestion() {
      if (currentIndex < rawData.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        alert("🎉 ممتاز يا بطل! أنهيت الكويزات المتوفرة بنجاح.");
      }
    }

    // بدء التشغيل
    window.onload = renderQuestion;
  </script>
</body>
</html>
